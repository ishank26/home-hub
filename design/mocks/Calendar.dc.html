<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calendar 3-day</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#1F5FD1}</style>
</helmet>
<div style="width: 1280px; height: 800px; display: flex; overflow: hidden; background: #FBFAF7; color: #1F2328; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif">
  <dc-import name="Sidebar" active="calendar" hint-size="180px,800px"></dc-import>
  <main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 22px 28px 20px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 16px">
      <h1 style="margin: 0; font-size: 32px">Calendar</h1>
      <div style="font-size: 22px; color: #2F3640; flex: 1">Thu Oct 10 – Sat Oct 12</div>
      <div role="group" aria-label="View" style="display: flex; padding: 4px; border-radius: 14px; background: #EFECE5">
        <button type="button" style="min-height: 52px; padding: 0 16px; border: 0; border-radius: 10px; background: transparent; font: inherit; font-size: 18px; color: #2A2F36">Day</button>
        <button type="button" aria-pressed="true" style="min-height: 52px; padding: 0 16px; border: 0; border-radius: 10px; background: #1F5FD1; font: inherit; font-size: 18px; font-weight: 700; color: #FFFFFF">3 Day</button>
        <button type="button" style="min-height: 52px; padding: 0 16px; border: 0; border-radius: 10px; background: transparent; font: inherit; font-size: 18px; color: #2A2F36">Week</button>
        <button type="button" style="min-height: 52px; padding: 0 16px; border: 0; border-radius: 10px; background: transparent; font: inherit; font-size: 18px; color: #2A2F36">Month</button>
      </div>
      <button type="button" aria-label="Previous days" style="width: 56px; height: 56px; border-radius: 14px; border: 1px solid #DCD8CE; background: #FFFFFF; font: inherit; font-size: 26px; color: #1F2328">‹</button>
      <button type="button" style="min-height: 56px; padding: 0 18px; border-radius: 14px; border: 1px solid #DCD8CE; background: #FFFFFF; font: inherit; font-size: 18px; font-weight: 700; color: #1F2328">Today</button>
      <button type="button" aria-label="Next days" style="width: 56px; height: 56px; border-radius: 14px; border: 1px solid #DCD8CE; background: #FFFFFF; font: inherit; font-size: 26px; color: #1F2328">›</button>
    </div>

    <div role="group" aria-label="Calendars shown" style="display: flex; gap: 10px; flex-wrap: wrap">
      <sc-for list="{{cals}}" as="c" hint-placeholder-count="4">
        <button type="button" aria-pressed="{{c.on}}" style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 16px; border-radius: 999px; border: 2px solid {{c.border}}; background: {{c.bg}}; font: inherit; font-size: 18px; font-weight: 700; color: {{c.fg}}">
          <span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 999px; background: {{c.dot}}"></span>{{c.name}}
        </button>
      </sc-for>
    </div>

    <div style="display: grid; grid-template-columns: 64px repeat(3, minmax(0, 1fr)); column-gap: 10px">
      <div></div>
      <sc-for list="{{days}}" as="d" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <div style="display: flex; align-items: baseline; gap: 10px; font-size: 20px"><span style="font-weight: 700; color: {{d.labelColor}}">{{d.dow}}</span><span style="{{d.numStyle}}">{{d.num}}</span></div>
          <div style="min-height: 40px; display: flex; flex-direction: column; gap: 4px">
            <sc-for list="{{d.allday}}" as="a" hint-placeholder-count="0">
              <div style="padding: 8px 12px; border-radius: 10px; font-size: 17px; font-weight: 700; background: {{a.bg}}; color: {{a.fg}}">{{a.title}} · all day</div>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="flex: 1; min-height: 0; display: grid; grid-template-columns: 64px repeat(3, minmax(0, 1fr)); column-gap: 10px; border-top: 1px solid #E6E2D9">
      <div style="position: relative">
        <sc-for list="{{hours}}" as="h" hint-placeholder-count="11">
          <div style="position: absolute; left: 0; top: {{h.top}}px; font-size: 16px; color: #4A5058; transform: translateY(-9px)">{{h.label}}</div>
        </sc-for>
      </div>
      <sc-for list="{{days}}" as="d" hint-placeholder-count="3">
        <div style="position: relative; background: {{d.colBg}}; border-radius: 0 0 12px 12px">
          <sc-for list="{{hours}}" as="h" hint-placeholder-count="11">
            <div style="position: absolute; left: 0; right: 0; top: {{h.top}}px; border-top: 1px solid #EFECE5"></div>
          </sc-for>
          <sc-for list="{{d.events}}" as="e" hint-placeholder-count="2">
            <div style="{{e.box}}">
              <div style="font-size: 18px; font-weight: 700; line-height: 1.2">{{e.title}}</div>
              <div style="font-size: 16px">{{e.time}}</div>
            </div>
          </sc-for>
          <sc-if value="{{d.isToday}}" hint-placeholder-val="{{ false }}">
            <div style="position: absolute; left: -6px; right: 0; top: {{nowTop}}px; height: 3px; background: #B42318"></div>
            <div style="position: absolute; left: -10px; top: {{nowDot}}px; width: 12px; height: 12px; border-radius: 999px; background: #B42318"></div>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const H = 50, start = 7;
    const C = {
      Family: { dot: '#2F6FD6', bg: '#DDE8FA', fg: '#143E8C' },
      Work: { dot: '#C2570C', bg: '#FBE3D2', fg: '#6A2E06' },
      School: { dot: '#0F7B6C', bg: '#D8EFEA', fg: '#0B4A41' },
      Sports: { dot: '#7A4CC2', bg: '#EBE1F8', fg: '#46237A' }
    };
    const box = (cal, s, e, lane, lanes) => {
      const c = C[cal];
      const w = 100 / lanes;
      return 'position:absolute;box-sizing:border-box;top:' + ((s - start) * H + 2) + 'px;height:' + ((e - s) * H - 4) +
        'px;left:calc(' + (lane * w) + '% + 4px);width:calc(' + w + '% - 8px);padding:8px 12px;border-radius:12px;overflow:hidden;background:' +
        c.bg + ';color:' + c.fg;
    };
    const ev = (title, time, cal, s, e, lane = 0, lanes = 1) => ({ title, time, box: box(cal, s, e, lane, lanes) });
    const ad = (title, cal) => ({ title, bg: C[cal].bg, fg: C[cal].fg });
    const day = (dow, num, isToday, events, allday) => ({
      dow, num, isToday, events, allday,
      labelColor: isToday ? '#1F5FD1' : '#2F3640',
      numStyle: isToday ? 'display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:999px;background:#1F5FD1;color:#FFFFFF;font-weight:700' : 'color:#2F3640',
      colBg: isToday ? '#F4F7FD' : 'transparent'
    });
    const hours = [];
    for (let i = 0; i <= 10; i++) {
      const h = start + i;
      hours.push({ top: i * H, label: (h > 12 ? h - 12 : h) + (h >= 12 ? ' PM' : ' AM') });
    }
    const now = 7 + 42 / 60;
    return {
      hours,
      nowTop: (now - start) * H - 1,
      nowDot: (now - start) * H - 5,
      cals: Object.keys(C).map((name) => ({
        name, on: name === 'Work' ? 'false' : 'true', dot: C[name].dot,
        bg: name === 'Work' ? '#FFFFFF' : C[name].bg, fg: name === 'Work' ? '#4A5058' : C[name].fg,
        border: name === 'Work' ? '#DCD8CE' : C[name].bg
      })),
      days: [
        day('Thu', '10', true, [
          ev('Lunch with Sarah', '12:00 – 1:00 PM', 'Family', 12, 13),
          ev('Soccer practice', '4:30 – 5:30 PM', 'Sports', 16.5, 17.5)
        ], []),
        day('Fri', '11', false, [
          ev('Dentist', '9:00 – 10:00 AM', 'Family', 9, 10, 0, 2),
          ev('School concert', '9:30 – 10:30 AM', 'School', 9.5, 10.5, 1, 2),
          ev('Grocery pickup', '2:00 – 2:30 PM', 'Family', 14, 14.75)
        ], [ad('No school', 'School')]),
        day('Sat', '12', false, [
          ev('Hike with friends', '8:00 – 11:00 AM', 'Family', 8, 11),
          ev('Soccer game', '1:00 – 3:00 PM', 'Sports', 13, 15)
        ], [ad('Grandma visiting', 'Family')])
      ]
    };
  }
}
</script>
</body>
</html>
