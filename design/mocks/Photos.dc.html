<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Photos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 800px; display: flex; overflow: hidden; background: #FBFAF7; color: #1F2328; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif">
  <dc-import name="Sidebar" active="photos" hint-size="180px,800px"></dc-import>
  <main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 22px 32px 20px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 18px">
      <h1 style="margin: 0; font-size: 32px">Photos</h1>
      <span style="font-size: 19px; color: #2F3640; flex: 1">From your Aura frame · synced 7:30 AM</span>
      <button type="button" style="display: flex; align-items: center; gap: 10px; min-height: 58px; padding: 0 24px; border-radius: 14px; border: 0; background: #1F5FD1; color: #FFFFFF; font: inherit; font-size: 20px; font-weight: 700">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"></path></svg>Start slideshow</button>
    </div>
    <div role="group" aria-label="Collection" style="display: flex; gap: 10px">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
        <button type="button" aria-pressed="{{f.pressed}}" onClick="{{f.pick}}" style="min-height: 50px; padding: 0 20px; border-radius: 999px; border: 1px solid {{f.border}}; background: {{f.bg}}; color: {{f.fg}}; font: inherit; font-size: 19px; font-weight: 700">{{f.name}}</button>
      </sc-for>
    </div>
    <div style="flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 14px">
      <sc-for list="{{tiles}}" as="t" hint-placeholder-count="12">
        <button type="button" aria-label="{{t.label}}" style="position: relative; border: 0; border-radius: 16px; overflow: hidden; background: {{t.bg}}; padding: 0; font: inherit">
          <svg aria-hidden="true" width="100%" height="100%" viewBox="0 0 240 160" preserveAspectRatio="xMidYMid slice" style="position: absolute; inset: 0">
            <path d="M0 120 L60 70 L100 100 L150 50 L240 115 L240 160 L0 160 Z" fill="{{t.fg}}" opacity="0.55"></path>
            <circle cx="190" cy="40" r="14" fill="{{t.fg}}" opacity="0.4"></circle>
          </svg>
        </button>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { f: 'All' }; }
  renderVals() {
    const names = ['All', 'Family', 'Trips', 'Seasonal'];
    const tones = [['#C9D3D6', '#4E6A73'], ['#D9D1C2', '#7A6345'], ['#CFD8C8', '#4F6B45'], ['#D6CCD8', '#6A4E73'],
      ['#D4CFC6', '#6B5E48'], ['#C6D2DB', '#45627A'], ['#DCCFC4', '#7D5A42'], ['#CBD6CF', '#46685A']];
    const count = { All: 12, Family: 8, Trips: 6, Seasonal: 4 }[this.state.f];
    const tiles = [];
    for (let i = 0; i < count; i++) {
      const [bg, fg] = tones[(i * 3) % tones.length];
      tiles.push({ bg, fg, label: 'Open photo ' + (i + 1) + ' fullscreen' });
    }
    return {
      tiles,
      filters: names.map((n) => {
        const on = n === this.state.f;
        return { name: n, pressed: on ? 'true' : 'false', bg: on ? '#1F2328' : '#FFFFFF', fg: on ? '#FFFFFF' : '#1F2328',
          border: on ? '#1F2328' : '#DCD8CE', pick: () => this.setState({ f: n }) };
      })
    };
  }
}
</script>
</body>
</html>
