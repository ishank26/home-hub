<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Main" style="width: 180px; height: 800px; box-sizing: border-box; padding: 20px 12px 16px; background: #F3F1EC; border-right: 1px solid #E3DFD6; display: flex; flex-direction: column; gap: 6px; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; color: #1F2328">
  <a href="Today.dc.html" style="{{s.today}}" aria-current="{{c.today}}">
    <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg>Today</a>
  <a href="Calendar.dc.html" style="{{s.calendar}}" aria-current="{{c.calendar}}">
    <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Calendar</a>
  <a href="Shopping.dc.html" style="{{s.shopping}}" aria-current="{{c.shopping}}">
    <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.5 11h11L21 7H6.5"></path><circle cx="9" cy="19" r="1.5"></circle><circle cx="17" cy="19" r="1.5"></circle></svg>Shopping</a>
  <a href="Weather.dc.html" style="{{s.weather}}" aria-current="{{c.weather}}">
    <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>Weather</a>
  <a href="Quotes.dc.html" style="{{s.quotes}}" aria-current="{{c.quotes}}">
    <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h4v4c0 3-2 5-4 6"></path><path d="M15 7h4v4c0 3-2 5-4 6"></path></svg>Quotes</a>
  <a href="Photos.dc.html" style="{{s.photos}}" aria-current="{{c.photos}}">
    <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 17l-5-5-9 8"></path></svg>Photos</a>
  <a href="SmartHome.dc.html" style="{{s.home}}" aria-current="{{c.home}}">
    <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"></path><path d="M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.7 1 2.5h6c0-.8.2-1.7 1-2.5A6 6 0 0 0 12 3z"></path></svg>Smart Home</a>
  <a href="Settings.dc.html" style="{{s.settings}}" aria-current="{{c.settings}}">
    <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>Settings</a>
  <div style="flex: 1"></div>
  <a href="Settings.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 8px 12px; border-radius: 14px; text-decoration: none; color: #2F3640; font-size: 16px; line-height: 1.3; background: #FFFFFF; border: 1px solid #E3DFD6">
    <span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 999px; background: {{dot}}; flex: none"></span>{{syncText}}</a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["today","calendar","shopping","weather","quotes","photos","home","settings"],"default":"today"},"sync":{"editor":"enum","options":["ok","stale"],"default":"ok"},"$preview":{"width":180,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'today';
    const base = 'display:flex;align-items:center;gap:14px;min-height:60px;padding:0 14px;border-radius:14px;text-decoration:none;font-size:19px;font-weight:700;';
    const keys = ['today', 'calendar', 'shopping', 'weather', 'quotes', 'photos', 'home', 'settings'];
    const s = {}, c = {};
    keys.forEach((k) => {
      s[k] = base + (k === active ? 'background:#1F5FD1;color:#FFFFFF' : 'color:#2A2F36');
      c[k] = k === active ? 'page' : 'false';
    });
    const stale = (this.props.sync ?? 'ok') === 'stale';
    return { s, c, dot: stale ? '#B45309' : '#15803D', syncText: stale ? 'Photos stale · 2 h' : 'All synced · 7:41' };
  }
}
</script>
</body>
</html>
