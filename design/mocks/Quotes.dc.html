<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quotes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;family=Fraunces:ital,opsz,wght@1,9..144,400&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 800px; display: flex; overflow: hidden; background: #FBFAF7; color: #1F2328; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif">
  <dc-import name="Sidebar" active="quotes" hint-size="180px,800px"></dc-import>
  <main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 22px 32px 24px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: baseline; gap: 18px">
      <h1 style="margin: 0; font-size: 32px">Quotes</h1>
      <span style="font-size: 20px; color: #2F3640">{{label}}</span>
    </div>
    <section style="flex: 1; min-height: 0; border-radius: 28px; background: #F3EEE4; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 48px 96px; text-align: center">
      <svg aria-hidden="true" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#9A7B4F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h4v4c0 3-2 5-4 6"></path><path d="M15 7h4v4c0 3-2 5-4 6"></path></svg>
      <blockquote style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-style: italic; font-size: 60px; line-height: 1.2; color: #2A2520">{{q.text}}</blockquote>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 26px; font-weight: 700">{{q.author}}</span>
        <span style="font-size: 19px; color: #5A4E3E">{{q.source}}</span>
      </div>
    </section>
    <div style="display: flex; justify-content: center; gap: 16px">
      <button type="button" aria-pressed="{{favPressed}}" onClick="{{toggleFav}}" style="display: flex; align-items: center; gap: 10px; min-height: 60px; padding: 0 24px; border-radius: 14px; border: 1px solid #C9C4B8; background: #FFFFFF; font: inherit; font-size: 20px; font-weight: 700; color: #1F2328">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="{{favFill}}" stroke="#B42318" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>
        {{favText}}
      </button>
      <button type="button" onClick="{{next}}" style="min-height: 60px; padding: 0 32px; border-radius: 14px; border: 0; background: #1F5FD1; color: #FFFFFF; font: inherit; font-size: 20px; font-weight: 700">Next quote</button>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { i: 0, fav: {} };
  }
  renderVals() {
    const quotes = [
      { text: '“Well done is better than well said.”', author: 'Benjamin Franklin', source: 'Poor Richard’s Almanack, 1737' },
      { text: '“The best way out is always through.”', author: 'Robert Frost', source: 'A Servant to Servants, 1914' },
      { text: '“Hope is the thing with feathers.”', author: 'Emily Dickinson', source: 'Poem 254 (Johnson numbering)' },
      { text: '“Not all those who wander are lost.”', author: 'J. R. R. Tolkien', source: 'The Fellowship of the Ring, 1954' }
    ];
    const i = this.state.i % quotes.length;
    const fav = !!this.state.fav[i];
    return {
      q: quotes[i],
      label: i === 0 ? 'Today’s quote · changes daily' : 'From the household collection',
      favPressed: fav ? 'true' : 'false',
      favFill: fav ? '#B42318' : 'none',
      favText: fav ? 'Saved' : 'Save',
      toggleFav: () => this.setState({ fav: { ...this.state.fav, [i]: !fav } }),
      next: () => this.setState({ i: this.state.i + 1 })
    };
  }
}
</script>
</body>
</html>
