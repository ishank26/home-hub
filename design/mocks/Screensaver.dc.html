<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Photo screensaver</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; overflow: hidden; background: #2E3A3F; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; color: #FFFFFF">
  <svg aria-hidden="true" width="1280" height="800" viewBox="0 0 1280 800" style="position: absolute; inset: 0">
    <rect width="1280" height="800" fill="#7FA2B3"></rect>
    <rect y="300" width="1280" height="500" fill="#5E8193"></rect>
    <path d="M0 470 L180 250 L300 380 L470 150 L640 400 L780 230 L960 420 L1110 260 L1280 430 L1280 800 L0 800 Z" fill="#3E5560"></path>
    <path d="M0 560 L220 440 L420 530 L640 450 L880 540 L1080 470 L1280 540 L1280 800 L0 800 Z" fill="#2C4048"></path>
    <rect y="610" width="1280" height="190" fill="#24343A"></rect>
  </svg>
  <div style="position: absolute; top: 28px; right: 32px; padding: 8px 16px; border-radius: 999px; background: rgba(20, 26, 30, 0.55); font-size: 16px">[Aura-synced photo]</div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 320px; background: linear-gradient(to top, rgba(10, 14, 16, 0.78), rgba(10, 14, 16, 0))"></div>
  <div style="position: absolute; left: 64px; bottom: 56px; display: flex; flex-direction: column; gap: 4px">
    <div style="font-size: 132px; font-weight: 700; line-height: 1; letter-spacing: -0.02em">7:42</div>
    <div style="font-size: 30px">Thursday, October 10 · 62° Clear</div>
  </div>
  <sc-if value="{{showHint}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; right: 64px; bottom: 64px; display: flex; align-items: center; gap: 12px; padding: 14px 22px; border-radius: 999px; background: rgba(20, 26, 30, 0.6); font-size: 22px">
      <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
      Swipe up to open
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"showHint":{"editor":"boolean","default":true},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return { showHint: this.props.showHint ?? true }; }
}
</script>
</body>
</html>
